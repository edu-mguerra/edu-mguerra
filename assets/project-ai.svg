<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 206" width="100%" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e1a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glowTop" cx="90%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#4facfe" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0"/>
    </radialGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'Fira Code', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      .dot { animation: pulse 2s ease-in-out infinite 0.4s; }
    </style>
  </defs>

  <rect x="1" y="1" width="818" height="204" rx="16" fill="url(#bg)" stroke="#4facfe" stroke-opacity="0.42" stroke-width="1.3"/>
  <rect x="1" y="1" width="818" height="204" rx="16" fill="url(#glowTop)"/>
  <rect x="28" y="1" width="180" height="3" rx="1.5" fill="#4facfe"/>

  <!-- Category Pill & CTA -->
  <rect x="28" y="20" width="232" height="26" rx="13" fill="#4facfe" fill-opacity="0.12" stroke="#4facfe" stroke-opacity="0.38"/>
  <circle class="dot" cx="44" cy="33" r="4" fill="#4facfe"/>
  <text x="56" y="37.5" class="mono" font-size="11.5" font-weight="700" fill="#38bdf8" letter-spacing="0.9">AI ENGINEERING // AGENTS</text>

  <rect x="656" y="20" width="136" height="26" rx="13" fill="#4facfe" fill-opacity="0.12" stroke="#4facfe" stroke-opacity="0.4"/>
  <text x="724" y="37.5" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" fill="#38bdf8">VER REPOSITÓRIO ↗</text>

  <!-- Title & Tagline -->
  <text x="28" y="78" class="sans" font-size="24" font-weight="800" fill="#f8fafc">LangChain &amp; LangGraph Cookbook — Agentes &amp; RAG</text>
  <text x="28" y="102" class="sans" font-size="14.5" font-weight="500" fill="#94a3b8">Práticas e padrões modernos para orquestração de agentes autônomos e busca semântica</text>

  <!-- Architecture Bullets -->
  <text x="28" y="132" class="sans" font-size="14" fill="#cbd5e1">▹ Padrões de produção com <tspan fill="#38bdf8" font-weight="700">LCEL, Memória Persistente &amp; Grafos</tspan> com roteamento condicional</text>
  <text x="28" y="154" class="sans" font-size="14" fill="#cbd5e1">▹ Pipeline <tspan fill="#38bdf8" font-weight="700">RAG com FAISS</tspan> + embeddings conectados a LLMs locais via <tspan fill="#e2e8f0" font-weight="600">LM Studio</tspan></text>

  <!-- Tech Pills -->
  <g transform="translate(28, 168)">
    <rect x="0" y="0" width="76" height="26" rx="7" fill="#1e293b" stroke="#334155"/><text x="38" y="17.5" text-anchor="middle" class="mono" font-size="11.5" fill="#e2e8f0">Python</text>
    <rect x="84" y="0" width="98" height="26" rx="7" fill="#1e293b" stroke="#334155"/><text x="133" y="17.5" text-anchor="middle" class="mono" font-size="11.5" fill="#38bdf8">LangChain</text>
    <rect x="190" y="0" width="98" height="26" rx="7" fill="#1e293b" stroke="#334155"/><text x="239" y="17.5" text-anchor="middle" class="mono" font-size="11.5" fill="#34d399">LangGraph</text>
    <rect x="296" y="0" width="70" height="26" rx="7" fill="#1e293b" stroke="#334155"/><text x="331" y="17.5" text-anchor="middle" class="mono" font-size="11.5" fill="#e2e8f0">FAISS</text>
    <rect x="374" y="0" width="66" height="26" rx="7" fill="#1e293b" stroke="#334155"/><text x="407" y="17.5" text-anchor="middle" class="mono" font-size="11.5" fill="#e2e8f0">LCEL</text>
    <rect x="448" y="0" width="96" height="26" rx="7" fill="#1e293b" stroke="#334155"/><text x="496" y="17.5" text-anchor="middle" class="mono" font-size="11.5" fill="#a78bfa">LM Studio</text>
  </g>
</svg>
