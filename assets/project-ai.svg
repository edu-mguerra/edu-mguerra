<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 226" width="100%" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e1a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glowTop" cx="85%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#4facfe" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0"/>
    </radialGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'Fira Code', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      .dot { animation: pulse 2s ease-in-out infinite 0.4s; }
    </style>
  </defs>

  <rect x="1" y="1" width="578" height="224" rx="16" fill="url(#bg)" stroke="#4facfe" stroke-opacity="0.4" stroke-width="1.3"/>
  <rect x="1" y="1" width="578" height="224" rx="16" fill="url(#glowTop)"/>
  <rect x="24" y="1" width="140" height="3" rx="1.5" fill="#4facfe"/>

  <!-- Category Pill & Status -->
  <rect x="24" y="20" width="206" height="24" rx="12" fill="#4facfe" fill-opacity="0.12" stroke="#4facfe" stroke-opacity="0.35"/>
  <circle class="dot" cx="38" cy="32" r="3.5" fill="#4facfe"/>
  <text x="49" y="36" class="mono" font-size="10.5" font-weight="700" fill="#38bdf8" letter-spacing="0.8">AI ENGINEERING // AGENTS</text>

  <text x="546" y="37" text-anchor="end" class="mono" font-size="13" font-weight="700" fill="#38bdf8">REPO ↗</text>

  <!-- Title & Tagline -->
  <text x="24" y="74" class="sans" font-size="22" font-weight="800" fill="#f8fafc">LangChain &amp; LangGraph Cookbook</text>
  <text x="24" y="96" class="sans" font-size="13.5" font-weight="500" fill="#94a3b8">Padrões modernos de agentes inteligentes, RAG vetorial e LLMs locais</text>

  <!-- Architecture Bullets -->
  <text x="24" y="128" class="sans" font-size="13" fill="#cbd5e1">▹ Arquiteturas <tspan fill="#38bdf8" font-weight="600">LCEL, Memória &amp; Grafos</tspan> com roteamento condicional</text>
  <text x="24" y="150" class="sans" font-size="13" fill="#cbd5e1">▹ Busca semântica <tspan fill="#38bdf8" font-weight="600">RAG com FAISS</tspan> integrada a LLMs locais (LM Studio)</text>

  <!-- Tech Pills -->
  <g transform="translate(24, 174)">
    <rect x="0" y="0" width="66" height="26" rx="7" fill="#1e293b" stroke="#334155"/><text x="33" y="17" text-anchor="middle" class="mono" font-size="11" fill="#e2e8f0">Python</text>
    <rect x="74" y="0" width="90" height="26" rx="7" fill="#1e293b" stroke="#334155"/><text x="119" y="17" text-anchor="middle" class="mono" font-size="11" fill="#38bdf8">LangChain</text>
    <rect x="172" y="0" width="92" height="26" rx="7" fill="#1e293b" stroke="#334155"/><text x="218" y="17" text-anchor="middle" class="mono" font-size="11" fill="#34d399">LangGraph</text>
    <rect x="272" y="0" width="64" height="26" rx="7" fill="#1e293b" stroke="#334155"/><text x="304" y="17" text-anchor="middle" class="mono" font-size="11" fill="#e2e8f0">FAISS</text>
    <rect x="344" y="0" width="88" height="26" rx="7" fill="#1e293b" stroke="#334155"/><text x="388" y="17" text-anchor="middle" class="mono" font-size="11" fill="#a78bfa">LM Studio</text>
  </g>
</svg>
