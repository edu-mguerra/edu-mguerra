<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 226" width="100%" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e1a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glowTop" cx="85%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#764ba2" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#764ba2" stop-opacity="0"/>
    </radialGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'Fira Code', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      .dot { animation: pulse 2s ease-in-out infinite 0.8s; }
    </style>
  </defs>

  <rect x="1" y="1" width="578" height="224" rx="16" fill="url(#bg)" stroke="#764ba2" stroke-opacity="0.45" stroke-width="1.3"/>
  <rect x="1" y="1" width="578" height="224" rx="16" fill="url(#glowTop)"/>
  <rect x="24" y="1" width="140" height="3" rx="1.5" fill="#a78bfa"/>

  <!-- Category Pill & Status -->
  <rect x="24" y="20" width="218" height="24" rx="12" fill="#764ba2" fill-opacity="0.16" stroke="#a78bfa" stroke-opacity="0.4"/>
  <circle class="dot" cx="38" cy="32" r="3.5" fill="#a78bfa"/>
  <text x="49" y="36" class="mono" font-size="10.5" font-weight="700" fill="#c084fc" letter-spacing="0.8">INDUSTRIAL // OFFLINE-FIRST</text>

  <text x="546" y="37" text-anchor="end" class="mono" font-size="13" font-weight="700" fill="#c084fc">REPO ↗</text>

  <!-- Title & Tagline -->
  <text x="24" y="74" class="sans" font-size="22" font-weight="800" fill="#f8fafc">LaserControl — Alta Disponibilidade</text>
  <text x="24" y="96" class="sans" font-size="13.5" font-weight="500" fill="#94a3b8">Sistema distribuído para chão de fábrica e controle de máquinas a laser</text>

  <!-- Architecture Bullets -->
  <text x="24" y="128" class="sans" font-size="13" fill="#cbd5e1">▹ Comunicação direta <tspan fill="#c084fc" font-weight="600">Serial (RS-232/COM)</tspan> com modo simulador e RBAC</text>
  <text x="24" y="150" class="sans" font-size="13" fill="#cbd5e1">▹ <tspan fill="#c084fc" font-weight="600">Guardião Offline</tspan>: cofre SQLite c/ sync em lote a cada 60s para Web API</text>

  <!-- Tech Pills -->
  <g transform="translate(24, 174)">
    <rect x="0" y="0" width="46" height="26" rx="7" fill="#1e293b" stroke="#334155"/><text x="23" y="17" text-anchor="middle" class="mono" font-size="11" fill="#c084fc">C#</text>
    <rect x="54" y="0" width="114" height="26" rx="7" fill="#1e293b" stroke="#334155"/><text x="111" y="17" text-anchor="middle" class="mono" font-size="11" fill="#e2e8f0">ASP.NET Core</text>
    <rect x="176" y="0" width="84" height="26" rx="7" fill="#1e293b" stroke="#334155"/><text x="218" y="17" text-anchor="middle" class="mono" font-size="11" fill="#e2e8f0">WinForms</text>
    <rect x="268" y="0" width="66" height="26" rx="7" fill="#1e293b" stroke="#334155"/><text x="301" y="17" text-anchor="middle" class="mono" font-size="11" fill="#e2e8f0">MySQL</text>
    <rect x="342" y="0" width="70" height="26" rx="7" fill="#1e293b" stroke="#334155"/><text x="377" y="17" text-anchor="middle" class="mono" font-size="11" fill="#e2e8f0">SQLite</text>
  </g>
</svg>
