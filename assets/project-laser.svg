<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 206" width="100%" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e1a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glowTop" cx="90%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#764ba2" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#764ba2" stop-opacity="0"/>
    </radialGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'Fira Code', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      .dot { animation: pulse 2s ease-in-out infinite 0.8s; }
    </style>
  </defs>

  <rect x="1" y="1" width="818" height="204" rx="16" fill="url(#bg)" stroke="#764ba2" stroke-opacity="0.45" stroke-width="1.3"/>
  <rect x="1" y="1" width="818" height="204" rx="16" fill="url(#glowTop)"/>
  <rect x="28" y="1" width="180" height="3" rx="1.5" fill="#a78bfa"/>

  <!-- Category Pill & CTA -->
  <rect x="28" y="20" width="248" height="26" rx="13" fill="#764ba2" fill-opacity="0.16" stroke="#a78bfa" stroke-opacity="0.4"/>
  <circle class="dot" cx="44" cy="33" r="4" fill="#a78bfa"/>
  <text x="56" y="37.5" class="mono" font-size="11.5" font-weight="700" fill="#c084fc" letter-spacing="0.9">INDUSTRIAL // OFFLINE-FIRST</text>

  <rect x="656" y="20" width="136" height="26" rx="13" fill="#764ba2" fill-opacity="0.18" stroke="#a78bfa" stroke-opacity="0.45"/>
  <text x="724" y="37.5" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" fill="#c084fc">VER REPOSITÓRIO ↗</text>

  <!-- Title & Tagline -->
  <text x="28" y="78" class="sans" font-size="24" font-weight="800" fill="#f8fafc">LaserControl — Sistema Industrial de Alta Disponibilidade</text>
  <text x="28" y="102" class="sans" font-size="14.5" font-weight="500" fill="#94a3b8">Arquitetura distribuída em 3 camadas (Desktop, Web API e Shared DTOs) para chão de fábrica</text>

  <!-- Architecture Bullets -->
  <text x="28" y="132" class="sans" font-size="14" fill="#cbd5e1">▹ Controle direto de máquinas via porta <tspan fill="#c084fc" font-weight="700">Serial (RS-232/COM)</tspan>, modo simulador e RBAC</text>
  <text x="28" y="154" class="sans" font-size="14" fill="#cbd5e1">▹ <tspan fill="#c084fc" font-weight="700">Guardião Offline</tspan>: cofre local SQLite com sincronização automática em lote a cada 60s</text>

  <!-- Tech Pills -->
  <g transform="translate(28, 168)">
    <rect x="0" y="0" width="52" height="26" rx="7" fill="#1e293b" stroke="#334155"/><text x="26" y="17.5" text-anchor="middle" class="mono" font-size="11.5" fill="#c084fc">C#</text>
    <rect x="60" y="0" width="122" height="26" rx="7" fill="#1e293b" stroke="#334155"/><text x="121" y="17.5" text-anchor="middle" class="mono" font-size="11.5" fill="#e2e8f0">ASP.NET Core</text>
    <rect x="190" y="0" width="90" height="26" rx="7" fill="#1e293b" stroke="#334155"/><text x="235" y="17.5" text-anchor="middle" class="mono" font-size="11.5" fill="#e2e8f0">WinForms</text>
    <rect x="288" y="0" width="74" height="26" rx="7" fill="#1e293b" stroke="#334155"/><text x="325" y="17.5" text-anchor="middle" class="mono" font-size="11.5" fill="#e2e8f0">MySQL</text>
    <rect x="370" y="0" width="74" height="26" rx="7" fill="#1e293b" stroke="#334155"/><text x="407" y="17.5" text-anchor="middle" class="mono" font-size="11.5" fill="#e2e8f0">SQLite</text>
    <rect x="452" y="0" width="114" height="26" rx="7" fill="#1e293b" stroke="#334155"/><text x="509" y="17.5" text-anchor="middle" class="mono" font-size="11.5" fill="#e2e8f0">Serial RS-232</text>
  </g>
</svg>
