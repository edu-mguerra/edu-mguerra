<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 28" width="100%" fill="none">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#667eea" stop-opacity="0"/>
      <stop offset="25%" stop-color="#667eea" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#764ba2" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#764ba2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#667eea" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes slideBeam {
        0% { transform: translateX(-220px); }
        100% { transform: translateX(1260px); }
      }
      .beam { animation: slideBeam 4.5s ease-in-out infinite; }
    </style>
  </defs>
  <rect x="20" y="13" width="1160" height="1.5" rx="0.75" fill="url(#divGrad)"/>
  <rect class="beam" x="0" y="12.5" width="180" height="2.5" rx="1.25" fill="url(#pulseGrad)"/>
  <polygon points="600,6 607,14 600,22 593,14" fill="#0d1324" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="600" cy="14" r="2.2" fill="#10b981"/>
</svg>
