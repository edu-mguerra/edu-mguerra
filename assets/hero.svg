<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="55%" stop-color="#0d1324"/>
      <stop offset="100%" stop-color="#08121e"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#764ba2" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.55"/>
    </linearGradient>

    <radialGradient id="orbPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#667eea" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#764ba2" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#764ba2" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orbEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.28"/>
      <stop offset="65%" stop-color="#10b981" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="sphereCore" cx="42%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#4facfe" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#667eea" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#090e1a" stop-opacity="0.05"/>
    </radialGradient>

    <pattern id="cyberGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#667eea" stroke-width="0.6" stroke-opacity="0.09"/>
    </pattern>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="cardClip">
      <rect x="2" y="2" width="1196" height="376" rx="20"/>
    </clipPath>

    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: 'Fira Code', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

      @keyframes pulseGlow {
        0%, 100% { opacity: 0.65; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.06); }
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes statusPulse {
        0%, 100% { r: 4; opacity: 1; }
        50% { r: 6; opacity: 0.45; }
      }
      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinReverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -120; }
      }
      @keyframes floatY {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes scanBeam {
        0% { transform: translateX(-300px); opacity: 0; }
        20% { opacity: 0.9; }
        80% { opacity: 0.9; }
        100% { transform: translateX(1300px); opacity: 0; }
      }

      .orb-a { transform-origin: 220px 110px; animation: pulseGlow 7s ease-in-out infinite; }
      .orb-b { transform-origin: 950px 210px; animation: pulseGlow 8s ease-in-out infinite 1.5s; }
      .cursor { animation: blink 1.1s step-end infinite; }
      .dot-live { animation: statusPulse 2s ease-in-out infinite; }
      .ring-1 { transform-origin: 955px 190px; animation: spinSlow 26s linear infinite; }
      .ring-2 { transform-origin: 955px 190px; animation: spinReverse 34s linear infinite; }
      .ring-3 { transform-origin: 955px 190px; animation: spinSlow 44s linear infinite; }
      .float-sphere { animation: floatY 5.5s ease-in-out infinite; }
      .neural-flow { stroke-dasharray: 8 12; animation: dashFlow 4s linear infinite; }
      .top-beam { animation: scanBeam 6s ease-in-out infinite; }
    </style>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Base & Cyber Grid -->
    <rect x="2" y="2" width="1196" height="376" rx="20" fill="url(#bgGrad)"/>
    <rect x="2" y="2" width="1196" height="376" rx="20" fill="url(#cyberGrid)"/>

    <!-- Ambient Orbs -->
    <circle class="orb-a" cx="220" cy="110" r="240" fill="url(#orbPurple)"/>
    <circle class="orb-b" cx="955" cy="190" r="250" fill="url(#orbEmerald)"/>

    <!-- Animated Top Laser Beam -->
    <rect class="top-beam" x="0" y="2" width="240" height="2.5" fill="url(#accentGrad)" filter="url(#glow)"/>

    <!-- Left Content -->
    <!-- Status Pill -->
    <rect x="52" y="42" width="388" height="30" rx="15" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.35" stroke-width="1"/>
    <circle class="dot-live" cx="72" cy="57" r="4" fill="#10b981" filter="url(#glow)"/>
    <text x="88" y="61" class="font-mono" font-size="11.5" font-weight="600" fill="#34d399" letter-spacing="1.1">SYSTEM ONLINE // FULL STACK &amp; AI ENGINEER</text>

    <!-- Main Name -->
    <text x="52" y="132" class="font-sans" font-size="54" font-weight="800" fill="#f8fafc" letter-spacing="-1">Eduardo <tspan fill="url(#accentGrad)">Guerra</tspan></text>

    <!-- Subtitle -->
    <text x="54" y="168" class="font-sans" font-size="18.5" font-weight="500" fill="#94a3b8">Arquitetando <tspan fill="#e2e8f0" font-weight="600">Sistemas Full Stack</tspan>, <tspan fill="#34d399" font-weight="600">Agentes de IA</tspan> &amp; soluções <tspan fill="#818cf8" font-weight="600">Offline-First</tspan></text>

    <!-- Terminal Showcase Box -->
    <rect x="52" y="196" width="635" height="142" rx="12" fill="#060911" fill-opacity="0.88" stroke="#334155" stroke-opacity="0.7" stroke-width="1.2"/>
    <!-- Terminal Header -->
    <rect x="52" y="196" width="635" height="28" rx="12" fill="#0f172a" fill-opacity="0.9"/>
    <rect x="52" y="212" width="635" height="12" fill="#0f172a" fill-opacity="0.9"/>
    <circle cx="72" cy="210" r="4.5" fill="#ef4444" fill-opacity="0.85"/>
    <circle cx="88" cy="210" r="4.5" fill="#f59e0b" fill-opacity="0.85"/>
    <circle cx="104" cy="210" r="4.5" fill="#10b981" fill-opacity="0.85"/>
    <text x="124" y="214" class="font-mono" font-size="11" fill="#64748b">eduardo@architecture:~/portfolio — zsh</text>

    <!-- Terminal Lines -->
    <text x="70" y="248" class="font-mono" font-size="13" fill="#10b981">$ <tspan fill="#cbd5e1">stack --focus</tspan></text>
    <text x="70" y="271" class="font-mono" font-size="12.5" fill="#64748b">├─ <tspan fill="#34d399" font-weight="600">AI_ENG</tspan>    <tspan fill="#e2e8f0">Python • LangChain • LangGraph • RAG/FAISS • OpenAI/Gemini</tspan></text>
    <text x="70" y="294" class="font-mono" font-size="12.5" fill="#64748b">├─ <tspan fill="#a78bfa" font-weight="600">BACKEND</tspan>   <tspan fill="#e2e8f0">C# / .NET 8 • FastAPI • NestJS • Node.js • PostgreSQL • Redis</tspan></text>
    <text x="70" y="317" class="font-mono" font-size="12.5" fill="#64748b">└─ <tspan fill="#60a5fa" font-weight="600">FRONT/OPS</tspan> <tspan fill="#e2e8f0">Next.js 15 • React Native • Docker • AWS • Linux VPS</tspan></text>
    <rect class="cursor" x="506" y="305" width="7" height="14" rx="1" fill="#10b981"/>

    <!-- Right Side: Interactive Particle Sphere & Neural Constellation -->
    <g class="float-sphere">
      <!-- Sphere Core Glow -->
      <circle cx="955" cy="190" r="108" fill="url(#sphereCore)" stroke="#667eea" stroke-opacity="0.22" stroke-width="1"/>
      <circle cx="955" cy="190" r="72" fill="none" stroke="#10b981" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="4 6"/>

      <!-- Orbiting Ellipses -->
      <g class="ring-1">
        <ellipse cx="955" cy="190" rx="145" ry="52" transform="rotate(-24 955 190)" fill="none" stroke="#667eea" stroke-opacity="0.45" stroke-width="1.2"/>
        <circle cx="1088" cy="131" r="4.5" fill="#667eea" filter="url(#glow)"/>
        <circle cx="822" cy="249" r="3.5" fill="#a78bfa" filter="url(#glow)"/>
      </g>

      <g class="ring-2">
        <ellipse cx="955" cy="190" rx="148" ry="56" transform="rotate(32 955 190)" fill="none" stroke="#10b981" stroke-opacity="0.45" stroke-width="1.2"/>
        <circle cx="1081" cy="268" r="4.5" fill="#10b981" filter="url(#glow)"/>
        <circle cx="829" cy="112" r="3.5" fill="#34d399" filter="url(#glow)"/>
      </g>

      <g class="ring-3">
        <ellipse cx="955" cy="190" rx="126" ry="126" fill="none" stroke="#4facfe" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="3 9"/>
        <circle cx="955" cy="64" r="4" fill="#4facfe" filter="url(#glow)"/>
      </g>

      <!-- Neural Connections Inside Sphere -->
      <g class="neural-flow" stroke-width="1.2" opacity="0.65">
        <line x1="905" y1="150" x2="960" y2="128" stroke="#667eea"/>
        <line x1="960" y1="128" x2="1008" y2="162" stroke="#4facfe"/>
        <line x1="905" y1="150" x2="948" y2="190" stroke="#a78bfa"/>
        <line x1="948" y1="190" x2="1008" y2="162" stroke="#10b981"/>
        <line x1="948" y1="190" x2="915" y2="236" stroke="#10b981"/>
        <line x1="948" y1="190" x2="996" y2="234" stroke="#667eea"/>
        <line x1="915" y1="236" x2="996" y2="234" stroke="#4facfe"/>
        <line x1="886" y1="192" x2="948" y2="190" stroke="#f093fb"/>
        <line x1="948" y1="190" x2="1024" y2="196" stroke="#34d399"/>
      </g>

      <!-- Sphere Lattice Particle Nodes -->
      <circle cx="948" cy="190" r="6" fill="#ffffff" filter="url(#glow)"/>
      <circle cx="948" cy="190" r="11" fill="#10b981" fill-opacity="0.25"/>
      <circle cx="905" cy="150" r="3.8" fill="#a78bfa" filter="url(#glow)"/>
      <circle cx="960" cy="128" r="4" fill="#4facfe" filter="url(#glow)"/>
      <circle cx="1008" cy="162" r="3.8" fill="#10b981" filter="url(#glow)"/>
      <circle cx="915" cy="236" r="3.8" fill="#34d399" filter="url(#glow)"/>
      <circle cx="996" cy="234" r="4" fill="#667eea" filter="url(#glow)"/>
      <circle cx="886" cy="192" r="3.2" fill="#f093fb" filter="url(#glow)"/>
      <circle cx="1024" cy="196" r="3.2" fill="#4facfe" filter="url(#glow)"/>
      <!-- Decorative micro-particles -->
      <circle cx="930" cy="168" r="1.8" fill="#e2e8f0" opacity="0.7"/>
      <circle cx="978" cy="155" r="1.8" fill="#e2e8f0" opacity="0.7"/>
      <circle cx="972" cy="212" r="1.8" fill="#34d399" opacity="0.8"/>
      <circle cx="924" cy="210" r="1.8" fill="#818cf8" opacity="0.8"/>
      <circle cx="952" cy="252" r="2" fill="#f093fb" opacity="0.7"/>
      <circle cx="990" cy="136" r="1.6" fill="#4facfe" opacity="0.65"/>
      <circle cx="918" cy="130" r="1.6" fill="#a78bfa" opacity="0.65"/>

      <!-- Floating Tech Node Badges around Sphere -->
      <g>
        <rect x="768" y="88" width="66" height="24" rx="12" fill="#0f172a" stroke="#10b981" stroke-opacity="0.6" stroke-width="1"/>
        <text x="801" y="104" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#34d399">AI / RAG</text>
      </g>
      <g>
        <rect x="1062" y="78" width="76" height="24" rx="12" fill="#0f172a" stroke="#667eea" stroke-opacity="0.6" stroke-width="1"/>
        <text x="1100" y="94" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#a78bfa">LangGraph</text>
      </g>
      <g>
        <rect x="1076" y="274" width="64" height="24" rx="12" fill="#0f172a" stroke="#4facfe" stroke-opacity="0.6" stroke-width="1"/>
        <text x="1108" y="290" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#60a5fa">.NET 8</text>
      </g>
      <g>
        <rect x="764" y="276" width="74" height="24" rx="12" fill="#0f172a" stroke="#f093fb" stroke-opacity="0.55" stroke-width="1"/>
        <text x="801" y="292" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#f0abfc">Next.js 15</text>
      </g>
    </g>
  </g>

  <!-- Outer Card Border -->
  <rect x="2" y="2" width="1196" height="376" rx="20" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>
</svg>
