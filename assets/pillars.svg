<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 324" width="100%" fill="none">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <radialGradient id="glowEmerald" cx="0%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#764ba2" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#764ba2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowIndigo" cx="0%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#667eea" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#667eea" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowSky" cx="0%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#4facfe" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0"/>
    </radialGradient>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'Fira Code', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      .p1 { animation: pulse 2.2s ease-in-out infinite; }
      .p2 { animation: pulse 2.2s ease-in-out infinite 0.55s; }
      .p3 { animation: pulse 2.2s ease-in-out infinite 1.1s; }
      .p4 { animation: pulse 2.2s ease-in-out infinite 1.65s; }
    </style>
  </defs>

  <!-- Card 01: AI Engineering -->
  <g transform="translate(0, 0)">
    <rect x="1" y="1" width="588" height="150" rx="16" fill="url(#cardBg)" stroke="#10b981" stroke-opacity="0.35" stroke-width="1.2"/>
    <rect x="1" y="1" width="588" height="150" rx="16" fill="url(#glowEmerald)"/>
    <rect x="22" y="20" width="42" height="42" rx="11" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.45"/>
    <!-- CPU / AI Icon -->
    <rect x="35" y="33" width="16" height="16" rx="3" stroke="#34d399" stroke-width="1.8"/>
    <circle cx="43" cy="41" r="2.5" fill="#34d399"/>
    <path d="M39 30v3M47 30v3M39 49v3M47 49v3M32 37h3M32 45h3M51 37h3M51 45h3" stroke="#34d399" stroke-width="1.6" stroke-linecap="round"/>

    <text x="80" y="36" class="mono" font-size="11" font-weight="700" fill="#34d399" letter-spacing="1.2">01 // AI ENGINEERING &amp; AGENTS</text>
    <text x="80" y="59" class="sans" font-size="18.5" font-weight="700" fill="#f8fafc">Engenharia de IA &amp; Agentes Autônomos</text>
    <circle class="p1" cx="564" cy="31" r="4" fill="#10b981"/>

    <text x="24" y="92" class="sans" font-size="13.5" fill="#cbd5e1">• Grafos condicionais, memória e tool-calling com <tspan fill="#34d399" font-weight="600">Python, LangChain &amp; LangGraph</tspan></text>
    <text x="24" y="114" class="sans" font-size="13.5" fill="#cbd5e1">• Pipelines <tspan fill="#34d399" font-weight="600">RAG &amp; FAISS</tspan> sobre bases corporativas + integração <tspan fill="#e2e8f0" font-weight="600">OpenAI, Gemini &amp; LLMs Locais</tspan></text>
    <text x="24" y="136" class="mono" font-size="11.5" fill="#64748b">LCEL  •  Vector Search  •  Multi-Agent Routing  •  Automation</text>
  </g>

  <!-- Card 02: Full Stack & Enterprise -->
  <g transform="translate(610, 0)">
    <rect x="1" y="1" width="588" height="150" rx="16" fill="url(#cardBg)" stroke="#764ba2" stroke-opacity="0.4" stroke-width="1.2"/>
    <rect x="1" y="1" width="588" height="150" rx="16" fill="url(#glowPurple)"/>
    <rect x="22" y="20" width="42" height="42" rx="11" fill="#764ba2" fill-opacity="0.18" stroke="#a78bfa" stroke-opacity="0.45"/>
    <!-- Code Icon -->
    <path d="M38 35l-6 6 6 6M48 35l6 6-6 6M44.5 33l-3 16" stroke="#c084fc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="80" y="36" class="mono" font-size="11" font-weight="700" fill="#c084fc" letter-spacing="1.2">02 // FULL STACK ARCHITECTURE</text>
    <text x="80" y="59" class="sans" font-size="18.5" font-weight="700" fill="#f8fafc">Back-End Corporativo &amp; Front-End Moderno</text>
    <circle class="p2" cx="564" cy="31" r="4" fill="#a78bfa"/>

    <text x="24" y="92" class="sans" font-size="13.5" fill="#cbd5e1">• APIs RESTful escaláveis em <tspan fill="#c084fc" font-weight="600">C# / .NET 8, ASP.NET Core, NestJS &amp; FastAPI</tspan> (JWT, RBAC)</text>
    <text x="24" y="114" class="sans" font-size="13.5" fill="#cbd5e1">• Interfaces reativas e SEO-ready com <tspan fill="#c084fc" font-weight="600">Next.js 15, React, TypeScript &amp; Tailwind CSS</tspan></text>
    <text x="24" y="136" class="mono" font-size="11.5" fill="#64748b">Clean Architecture  •  Microservices  •  ERP Integrations  •  DTOs</text>
  </g>

  <!-- Card 03: High Availability & Offline-First -->
  <g transform="translate(0, 172)">
    <rect x="1" y="1" width="588" height="150" rx="16" fill="url(#cardBg)" stroke="#667eea" stroke-opacity="0.4" stroke-width="1.2"/>
    <rect x="1" y="1" width="588" height="150" rx="16" fill="url(#glowIndigo)"/>
    <rect x="22" y="20" width="42" height="42" rx="11" fill="#667eea" fill-opacity="0.18" stroke="#667eea" stroke-opacity="0.45"/>
    <!-- Shield / Resilience Icon -->
    <path d="M43 31l9 4v6c0 5.5-3.8 10.2-9 11.5-5.2-1.3-9-6-9-11.5v-6l9-4z" stroke="#818cf8" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M39 41.5l2.8 2.8 5.4-5.4" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="80" y="36" class="mono" font-size="11" font-weight="700" fill="#818cf8" letter-spacing="1.2">03 // ZERO DOWNTIME &amp; MOBILE</text>
    <text x="80" y="59" class="sans" font-size="18.5" font-weight="700" fill="#f8fafc">Alta Disponibilidade &amp; Offline-First</text>
    <circle class="p3" cx="564" cy="31" r="4" fill="#667eea"/>

    <text x="24" y="92" class="sans" font-size="13.5" fill="#cbd5e1">• Apps de campo em <tspan fill="#818cf8" font-weight="600">React Native &amp; Expo</tspan> com fila local e sincronização resiliente</text>
    <text x="24" y="114" class="sans" font-size="13.5" fill="#cbd5e1">• Sistemas industriais com cofre <tspan fill="#818cf8" font-weight="600">SQLite</tspan>, integração <tspan fill="#e2e8f0" font-weight="600">Serial RS-232</tspan> e zero parada operacional</text>
    <text x="24" y="136" class="mono" font-size="11.5" fill="#64748b">Offline-First  •  Conflict Resolution  •  Auto-Sync  •  Industrial IoT</text>
  </g>

  <!-- Card 04: Data, Cloud & Observability -->
  <g transform="translate(610, 172)">
    <rect x="1" y="1" width="588" height="150" rx="16" fill="url(#cardBg)" stroke="#4facfe" stroke-opacity="0.38" stroke-width="1.2"/>
    <rect x="1" y="1" width="588" height="150" rx="16" fill="url(#glowSky)"/>
    <rect x="22" y="20" width="42" height="42" rx="11" fill="#4facfe" fill-opacity="0.16" stroke="#4facfe" stroke-opacity="0.45"/>
    <!-- Cloud / Database Icon -->
    <ellipse cx="43" cy="35" rx="9" ry="3.5" stroke="#38bdf8" stroke-width="1.7"/>
    <path d="M34 35v12c0 1.9 4 3.5 9 3.5s9-1.6 9-3.5V35" stroke="#38bdf8" stroke-width="1.7"/>
    <path d="M34 41c0 1.9 4 3.5 9 3.5s9-1.6 9-3.5" stroke="#38bdf8" stroke-width="1.7"/>

    <text x="80" y="36" class="mono" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.2">04 // DATA, CLOUD &amp; OBSERVABILITY</text>
    <text x="80" y="59" class="sans" font-size="18.5" font-weight="700" fill="#f8fafc">Dados, Infraestrutura &amp; Segurança</text>
    <circle class="p4" cx="564" cy="31" r="4" fill="#4facfe"/>

    <text x="24" y="92" class="sans" font-size="13.5" fill="#cbd5e1">• Modelagem e tuning em <tspan fill="#38bdf8" font-weight="600">PostgreSQL, SQL Server, MySQL, MongoDB &amp; Redis</tspan></text>
    <text x="24" y="114" class="sans" font-size="13.5" fill="#cbd5e1">• Agentes de telemetria, blindagem <tspan fill="#38bdf8" font-weight="600">Anti-SSRF</tspan>, pipelines <tspan fill="#e2e8f0" font-weight="600">ETL/ELT, Docker &amp; AWS</tspan></text>
    <text x="24" y="136" class="mono" font-size="11.5" fill="#64748b">SQLAlchemy Async  •  Systemd Daemons  •  Linux VPS  •  Caching</text>
  </g>
</svg>
