<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" fill="none">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <radialGradient id="glowEmerald" cx="0%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#764ba2" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#764ba2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowIndigo" cx="0%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#667eea" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#667eea" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowSky" cx="0%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#4facfe" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0"/>
    </radialGradient>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'Fira Code', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      .p1 { animation: pulse 2.2s ease-in-out infinite; }
      .p2 { animation: pulse 2.2s ease-in-out infinite 0.55s; }
      .p3 { animation: pulse 2.2s ease-in-out infinite 1.1s; }
      .p4 { animation: pulse 2.2s ease-in-out infinite 1.65s; }
    </style>
  </defs>

  <!-- 01 // ENGENHARIA DE IA & AGENTES (Top Left) -->
  <g transform="translate(0, 0)">
    <rect x="1" y="1" width="468" height="206" rx="16" fill="url(#cardBg)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.3"/>
    <rect x="1" y="1" width="468" height="206" rx="16" fill="url(#glowEmerald)"/>
    <rect x="22" y="1" width="115" height="3" rx="1.5" fill="#10b981"/>

    <rect x="22" y="20" width="40" height="40" rx="10" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.45"/>
    <rect x="34" y="32" width="16" height="16" rx="3" stroke="#34d399" stroke-width="1.8"/>
    <circle cx="42" cy="40" r="2.5" fill="#34d399"/>
    <path d="M38 29v3M46 29v3M38 48v3M46 48v3M31 36h3M31 44h3M50 36h3M50 44h3" stroke="#34d399" stroke-width="1.6" stroke-linecap="round"/>

    <text x="74" y="35" class="mono" font-size="11" font-weight="700" fill="#34d399" letter-spacing="1">01 // AI ENGINEERING &amp; AGENTS</text>
    <text x="74" y="57" class="sans" font-size="18" font-weight="800" fill="#f8fafc">Engenharia de IA &amp; Agentes</text>
    <circle class="p1" cx="446" cy="28" r="4" fill="#10b981"/>

    <text x="22" y="92" class="sans" font-size="14" fill="#cbd5e1">▹ Agentes autônomos e grafos condicionais com</text>
    <text x="34" y="113" class="sans" font-size="14" fill="#34d399" font-weight="700">Python, LangChain &amp; LangGraph</text>

    <text x="22" y="140" class="sans" font-size="14" fill="#cbd5e1">▹ Pipelines <tspan fill="#34d399" font-weight="700">RAG &amp; FAISS</tspan> + integração com</text>
    <text x="34" y="161" class="sans" font-size="14" fill="#e2e8f0" font-weight="600">OpenAI, Gemini &amp; LLMs Locais (LM Studio)</text>

    <text x="22" y="189" class="mono" font-size="11.5" fill="#64748b">LCEL • Vector Search • Tool-Calling • Automation</text>
  </g>

  <!-- 02 // FULL STACK ARCHITECTURE (Top Right) -->
  <g transform="translate(490, 0)">
    <rect x="1" y="1" width="468" height="206" rx="16" fill="url(#cardBg)" stroke="#764ba2" stroke-opacity="0.45" stroke-width="1.3"/>
    <rect x="1" y="1" width="468" height="206" rx="16" fill="url(#glowPurple)"/>
    <rect x="22" y="1" width="115" height="3" rx="1.5" fill="#a78bfa"/>

    <rect x="22" y="20" width="40" height="40" rx="10" fill="#764ba2" fill-opacity="0.18" stroke="#a78bfa" stroke-opacity="0.45"/>
    <path d="M37 34l-6 6 6 6M47 34l6 6-6 6M43.5 32l-3 16" stroke="#c084fc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="74" y="35" class="mono" font-size="11" font-weight="700" fill="#c084fc" letter-spacing="1">02 // FULL STACK ARCHITECTURE</text>
    <text x="74" y="57" class="sans" font-size="18" font-weight="800" fill="#f8fafc">Back-End &amp; Front-End Moderno</text>
    <circle class="p2" cx="446" cy="28" r="4" fill="#a78bfa"/>

    <text x="22" y="92" class="sans" font-size="14" fill="#cbd5e1">▹ APIs RESTful com <tspan fill="#c084fc" font-weight="700">Node.js, Express, NestJS</tspan>,</text>
    <text x="34" y="113" class="sans" font-size="14" fill="#c084fc" font-weight="700">C# / .NET 8, ASP.NET Core &amp; FastAPI</text>

    <text x="22" y="140" class="sans" font-size="14" fill="#cbd5e1">▹ Interfaces reativas e SEO-ready em</text>
    <text x="34" y="161" class="sans" font-size="14" fill="#e2e8f0" font-weight="600">Next.js 15, React, TypeScript &amp; Tailwind CSS</text>

    <text x="22" y="189" class="mono" font-size="11.5" fill="#64748b">JWT • RBAC • Clean Architecture • Microservices</text>
  </g>

  <!-- 03 // ALTA DISPONIBILIDADE & OFFLINE-FIRST (Bottom Left) -->
  <g transform="translate(0, 228)">
    <rect x="1" y="1" width="468" height="206" rx="16" fill="url(#cardBg)" stroke="#667eea" stroke-opacity="0.45" stroke-width="1.3"/>
    <rect x="1" y="1" width="468" height="206" rx="16" fill="url(#glowIndigo)"/>
    <rect x="22" y="1" width="115" height="3" rx="1.5" fill="#667eea"/>

    <rect x="22" y="20" width="40" height="40" rx="10" fill="#667eea" fill-opacity="0.18" stroke="#667eea" stroke-opacity="0.45"/>
    <path d="M42 30l9 4v6c0 5.5-3.8 10.2-9 11.5-5.2-1.3-9-6-9-11.5v-6l9-4z" stroke="#818cf8" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M38 40.5l2.8 2.8 5.4-5.4" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="74" y="35" class="mono" font-size="11" font-weight="700" fill="#818cf8" letter-spacing="1">03 // ZERO DOWNTIME &amp; MOBILE</text>
    <text x="74" y="57" class="sans" font-size="18" font-weight="800" fill="#f8fafc">Alta Disponibilidade &amp; Offline-First</text>
    <circle class="p3" cx="446" cy="28" r="4" fill="#667eea"/>

    <text x="22" y="92" class="sans" font-size="14" fill="#cbd5e1">▹ Apps móveis em <tspan fill="#818cf8" font-weight="700">React Native &amp; Expo</tspan></text>
    <text x="34" y="113" class="sans" font-size="14" fill="#e2e8f0" font-weight="600">com fila local e sincronização resiliente</text>

    <text x="22" y="140" class="sans" font-size="14" fill="#cbd5e1">▹ Sistemas industriais com cofre <tspan fill="#818cf8" font-weight="700">SQLite</tspan></text>
    <text x="34" y="161" class="sans" font-size="14" fill="#e2e8f0" font-weight="600">e integração direta Serial RS-232 / COM</text>

    <text x="22" y="189" class="mono" font-size="11.5" fill="#64748b">Offline-First • Auto-Sync • Conflict Resolution</text>
  </g>

  <!-- 04 // DADOS, CLOUD & OBSERVABILIDADE (Bottom Right) -->
  <g transform="translate(490, 228)">
    <rect x="1" y="1" width="468" height="206" rx="16" fill="url(#cardBg)" stroke="#4facfe" stroke-opacity="0.42" stroke-width="1.3"/>
    <rect x="1" y="1" width="468" height="206" rx="16" fill="url(#glowSky)"/>
    <rect x="22" y="1" width="115" height="3" rx="1.5" fill="#4facfe"/>

    <rect x="22" y="20" width="40" height="40" rx="10" fill="#4facfe" fill-opacity="0.16" stroke="#4facfe" stroke-opacity="0.45"/>
    <ellipse cx="42" cy="34" rx="9" ry="3.5" stroke="#38bdf8" stroke-width="1.7"/>
    <path d="M33 34v12c0 1.9 4 3.5 9 3.5s9-1.6 9-3.5V34" stroke="#38bdf8" stroke-width="1.7"/>
    <path d="M33 40c0 1.9 4 3.5 9 3.5s9-1.6 9-3.5" stroke="#38bdf8" stroke-width="1.7"/>

    <text x="74" y="35" class="mono" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">04 // DATA, CLOUD &amp; SECURITY</text>
    <text x="74" y="57" class="sans" font-size="18" font-weight="800" fill="#f8fafc">Dados, Infra &amp; Observabilidade</text>
    <circle class="p4" cx="446" cy="28" r="4" fill="#4facfe"/>

    <text x="22" y="92" class="sans" font-size="14" fill="#cbd5e1">▹ Modelagem &amp; tuning em <tspan fill="#38bdf8" font-weight="700">PostgreSQL, SQL Server,</tspan></text>
    <text x="34" y="113" class="sans" font-size="14" fill="#38bdf8" font-weight="700">MySQL, SQLite, MongoDB &amp; Redis</text>

    <text x="22" y="140" class="sans" font-size="14" fill="#cbd5e1">▹ Agentes de telemetria, <tspan fill="#38bdf8" font-weight="700">Anti-SSRF</tspan>, pipelines</text>
    <text x="34" y="161" class="sans" font-size="14" fill="#e2e8f0" font-weight="600">ETL/ELT, Docker, Linux VPS &amp; AWS</text>

    <text x="22" y="189" class="mono" font-size="11.5" fill="#64748b">SQLAlchemy Async • Systemd • Caching • CI/CD</text>
  </g>
</svg>
